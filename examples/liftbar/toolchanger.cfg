#####################################################################
#   Toolchanger — liftbar dropoff / pickup choreography
#####################################################################
#
# EXAMPLE — the main [toolchanger] config for a flying-gantry liftbar
# build (Voron 2.4 / StealthChanger, 4 tools, Cartographer on the shuttle).
#
# This is where the liftbar actually drives a tool change. The key idea:
# dispatch LIFTBAR_MOVE ... SYNC=0 so the liftbar moves CONCURRENTLY with
# the X/Z gantry approach, then LIFTBAR_MOVE SYNC=1 to wait for the slower
# of the two. The toolhead only moves X/Y for the change; the liftbar
# provides the Z engage/release motion.
#
# Companion files (examples/liftbar/):
#   liftbar.cfg                - LIFTBAR_* macros + PANEL_ON/OFF
#   hardware.cfg               - [manual_rail liftbar] + tmc + [idle_timeout]
#   homing.cfg                 - G32 / QGL that raise the liftbar clear
#   toolhead_calibration.cfg   - per-tool offset calibration
#
# Machine-specific bits to change for your build: park/probe coordinates,
# the StealthChanger dropoff/pickup paths, tool section names (ebbT0…),
# fan names (T0_partfan), and the Cartographer touch-model calls.
#####################################################################

[rounded_path]
  resolution: 0.2 # the length of a circle approximation segments.
  replace_g0: False # Use at your own risk

# [tool_probe_endstop] is now created internally by the toolchanger
# when tools have tool_probe: set. Crash detection config is not
# supported on the internal instance — re-add if upstream adds support.

[toolchanger]
  t_command_restore_axis: Z
  params_safe_y: 150
  params_close_y: 125
  params_fast_speed: 30000 # Go as fast as we can
  params_path_speed: 1200 # 20mm/s for the actual change
  params_z_lift: 15 # lift Z height on tool change
  params_liftbar_stow_height: 431.0 # 270 Height to lift above change height; top on = 150 | 420
  params_liftbar_safe_clearance: 200.0 # clearance above print during toolchanges (full stow only at print end)
  params_liftbar_speed: 12000 # 200mm/s in mm/min for LIFTBAR_MOVE F parameter
  params_liftbar_min_z: 25.00
  params_liftbar_max_z: 431 #420 | 270 with panel liftbar
  # Path positions relative to the park position
  # use x,y,z; f= multiplier to path speed; verify= Verify tool detected at end of the move.
  #
  # Reference paths (from klipper-toolchanger-easy/examples/tool_paths.md):
  # StealthChanger:
  # params_dropoff_path: [{'z':5, 'y':58}, {'z':3.5, 'y':4}, {'z':0, 'y':0}, {'z':-13.5, 'y':0}]
  params_dropoff_path: [{'z':3.5, 'y':5}, {'z':0, 'y':0}, {'z':-14.5, 'y':0}]
  params_pickup_path:  [{'z':-14.5, 'y':2}, {'z':-14.5, 'y':0, 'f':2.0}, {'z':1.5, 'y':0, 'f':0.5, 'verify':1}, {'z':0.5, 'y':2.5, 'f':0.5}, {'z':3.5, 'y':8}]
  # TapChanger:
  #   dropoff: [{'z':0, 'y':4}, {'z':0, 'y':0}, {'z':-7.3, 'y':0}, {'z':-11.2, 'y':3.5}, {'z':-13.2, 'y':8}]
  #   pickup:  [{'z':-13.2, 'y':8}, {'z':-11.2, 'y':3.5}, {'z':-7.3, 'y':0}, {'z':3, 'y':0, 'f':0.5, 'verify':1}, {'z':0, 'y':0}, {'z':0, 'y':4}]
  # ClickChanger:
  #   dropoff: [{'z':0, 'y':10}, {'z':0, 'y':0}, {'z':-8, 'y':0}, {'z':-9, 'y':3}]
  #   pickup:  [{'z':-9, 'y':3}, {'z':-8, 'y':0}, {'z':-4, 'y':0}, {'z':0, 'f':0.5, 'verify':1}, {'y':10, 'z':0}]

  # Parking position - per tool
  # x positions: T0 40.1, T1 127.5, T2 214.5 T3: 301.5
  # params_park_y: 19.00
  # params_park_z: 24
  # Calibration probe position
  params_probe_x: 118.25
  params_probe_y: 353.8
  params_probe_z: 10
  # Default shaper params - per tool
  #params_input_shaper_freq_x: 62.4
  #params_input_shaper_freq_y: 88.6
  initialize_on: manual
  require_tool_present: FALSE
  verify_tool_pickup: TRUE

  initialize_gcode:
    LIFTBAR_HOME
    LIFTBAR_MOVE z={ toolchanger.params_liftbar_stow_height } F={ toolchanger.params_liftbar_speed }

  before_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
       SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
    {% endif %}

  after_change_gcode:
    {% set tn = "T"+(tool.tool_number|string) %}
    {% if printer["gcode_macro " + tn ] %}
       SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
    {% endif %}
    {% if tool.params_input_shaper_freq_x %}
      SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x} SHAPER_FREQ_X={tool.params_input_shaper_freq_x} SHAPER_TYPE_Y={tool.params_input_shaper_type_y} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y}
    {% endif %}
    CARTOGRAPHER_TOUCH_MODEL LOAD=t{tool.tool_number}

  dropoff_gcode:
    # Turn off part fan before dropping tool (fan_generic won't respond to M107)
    SET_FAN_SPEED FAN=T{tool.tool_number}_partfan SPEED=0
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_dropoff_path %}
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float - 10.0 %}
    {% set cur_z = printer.toolhead.position[2]|float %}
    {% set tz = [cur_z - tool.params_park_z + tool.params_z_lift, max_z]|min %}
    {% if tz < tool.params_liftbar_min_z %}
        {% set liftbar_z = tool.params_liftbar_min_z %}
    {% elif tz > tool.params_liftbar_max_z %}
        {% set liftbar_z = tool.params_liftbar_max_z %}
    {% else %}
        {% set liftbar_z = tz %}
    {% endif %}
    {% set z = liftbar_z + tool.params_park_z %}

    RESPOND TYPE=echo MSG='Dropping off {tool.name}'
    G90
    ###############  Align with the dock  ##############
    # Dispatch the liftbar first so it schedules at the current print time;
    # the gantry chain below (flushed by D=0) then queues alongside it and
    # the two moves run concurrently. SYNC=1 waits for the slower of the two.
    LIFTBAR_MOVE Z={ liftbar_z } SYNC=0 F={ tool.params_liftbar_speed }
    ROUNDED_G0 Z={ z + path[0]['z']|float } D=10 F={fast}
    ROUNDED_G0 Y={tool.params_safe_y} D=5 F={fast}
    ROUNDED_G0 X={x} F={fast} D=0
    LIFTBAR_MOVE SYNC=1
    #  ############## Run the path ##############
    ROUNDED_G0 Y={y + path[0]['y']|float} D=0 F={fast}
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
    {% endfor %}
    # If no pickup follows (UNSELECT_TOOL), retract Y before Z restore lifts shuttle back through tool
    {% if not pickup_tool %}
      G0 Y{tool.params_safe_y} F{fast}
    {% endif %}

  pickup_gcode:
    {% set x = tool.params_park_x|float %}
    {% set y = tool.params_park_y|float %}
    {% set cur_z = printer.toolhead.position[2]|float %}
    {% set liftbar_z = printer['gcode_macro LIFTBAR_MOVE'].position|float %}
    # If liftbar is above where the gantry needs to be, lower it to match
    {% set target_liftbar_z = [cur_z - tool.params_park_z + tool.params_z_lift, tool.params_liftbar_min_z]|max %}
    {% if liftbar_z > target_liftbar_z %}
      {% set liftbar_z = target_liftbar_z %}
    {% endif %}
    {% set z = liftbar_z + tool.params_park_z %}
    {% set stow_z = [[liftbar_z, start_position.Z + tool.params_liftbar_safe_clearance]|max,tool.params_liftbar_max_z] | min %}
    {% set fast = tool.params_fast_speed|float %}
    {% set path = tool.params_pickup_path %}
    RESPOND TYPE=echo MSG='Picking up {tool.name}'
    G90
    #   ##############  Fast to the last point  ##############
    # Y-retreat must complete before the liftbar moves (printhead must clear
    # the liftbar sweep). D=0 flushes it, so LIFTBAR_MOVE schedules AFTER it.
    # The X/Z approach below then runs concurrently with the liftbar.
    ROUNDED_G0 Y={tool.params_close_y} F={fast} D=0
    LIFTBAR_MOVE Z={ liftbar_z } SYNC=0 F={ tool.params_liftbar_speed }
    ROUNDED_G0 X={x} Z={z + path[0]['z']|float} F={fast} D=0
    LIFTBAR_MOVE SYNC=1
    ROUNDED_G0 Y={y + path[0]['y']|float} F={fast} D=0

    # Wait for temp before actually picking up the tool, while the nozzle is resting on it's pad.
    {% if tool.extruder %}
      TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={printer[tool.extruder].target}
    {% endif %}
    # Run the path
    {% for pos in path %}
      {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
      G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float }{% endif %} F{speed}
      {% if 'verify' in pos %}
        VERIFY_TOOL_DETECTED T={tool.tool_number}
      {% endif %}
    {% endfor %}
    G0 Y{tool.params_safe_y} F{fast}
    {% if printer.virtual_sdcard.is_active %}
      LIFTBAR_MOVE Z={stow_z} SYNC=0 F={ tool.params_liftbar_speed }
    {% else %}
      LIFTBAR_MOVE Z={ tool.params_liftbar_stow_height } SYNC=0
    {% endif %}
    G0 Z{start_position.Z|float} F{fast}
    LIFTBAR_MOVE SYNC=1

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED
  LIFTBAR_LAYER_CHANGE
  RESUME_BASE

[gcode_macro _PARK_TOOLHEAD]
gcode:
  {% if not printer.toolchanger.tool %}
    RESPOND TYPE=error MSG='Cannot part toolhead - no tool selected'
  {% else %}
    {% set tool = printer[printer.toolchanger.tool] %}
    G90
    G0 X{tool.params_park_x} Y{tool.params_safe_y|float + 20} F{tool.params_fast_speed}
  {% endif %}

[gcode_macro DOCK_ALIGN_START]
gcode:
    INITIALIZE_TOOLCHANGER # Detect current tool
    _DOCK_ALIGN_START

[gcode_macro _DOCK_ALIGN_START]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    {% set z = tool.params_liftbar_min_z %}
    SET_TOOL_PARAMETER PARAMETER='params_path_speed' VALUE=300
    SET_TOOL_PARAMETER PARAMETER='params_z_lift' VALUE=0.0
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}
    G0 X{tool.params_park_x} Z{z + tool.params_park_z|float }
    LIFTBAR_MOVE Z={z}
    G0 Y{tool.params_park_y|float + 100.0}

[gcode_macro DOCK_ALIGN_TEST]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    {% set z = tool.params_liftbar_min_z %}
    {% set curpos = printer.gcode_move.gcode_position %}
    {% if curpos[1] > 30 %}
      # Check if Y is not too far, to very unrealistic tests.
      RESPOND TYPE=error MSG='Test aborted. Tool too far away from the dock.'
    {% else %}
      INITIALIZE_TOOLCHANGER # Detect current tool
      SET_GCODE_OFFSET X=0 Y=0 Z=0
      SET_TOOL_PARAMETER PARAMETER='params_park_x' VALUE={curpos[0]}
      SET_TOOL_PARAMETER PARAMETER='params_park_y' VALUE={curpos[1]}
      SET_TOOL_PARAMETER PARAMETER='params_park_z' VALUE={curpos[2] - z}
      TEST_TOOL_DOCKING RESTORE_AXIS=XZ
      LIFTBAR_MOVE Z={z}
      G0 Y{curpos[1]}
    {% endif %}

[gcode_macro DOCK_ALIGN_DONE]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    {% set curpos = printer.gcode_move.gcode_position %}
    {% set z = tool.params_liftbar_min_z %}
    SET_TOOL_PARAMETER PARAMETER='params_park_x' VALUE={curpos[0]}
    SET_TOOL_PARAMETER PARAMETER='params_park_y' VALUE={curpos[1]}
    SET_TOOL_PARAMETER PARAMETER='params_park_z' VALUE={curpos[2] - z}
    SAVE_TOOL_PARAMETER PARAMETER='params_park_x'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_y'
    SAVE_TOOL_PARAMETER PARAMETER='params_park_z'
    RESET_TOOL_PARAMETER PARAMETER='params_path_speed'
    RESET_TOOL_PARAMETER PARAMETER='params_z_lift'
    G0 Y{tool.params_safe_y} F{tool.params_fast_speed}


#####################################################################
#   Homing Override
#   Replaces [safe_z_home] in octopus_pro_v1.0.cfg.
#   Corrects for tool probe z_offset not being applied at config-parse
#   time (stepper.py caches EndstopRouter's 0.0 permanently).
#   Ref: klipper-toolchanger-easy/examples/easy-additions/homing.cfg
#####################################################################

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
  G90

  # Ensure safe Z height before any moves
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z=0
    G0 Z10 F1000
  {% elif printer.toolhead.position[2]|float < 10 %}
    G0 Z10 F1000
  {% endif %}

  {% if home_all or 'Y' in params %}
    G28 Y
    G0 Y{ printer.configfile.config["stepper_y"]["position_endstop"]|float - 20 } F12000
  {% endif %}

  # Initialize toolchanger after Y is homed so the gantry is safe
  # before the liftbar moves. Only on full home or Y home — skip for
  # Z-only re-home (e.g. after QGL) where toolchanger is already set up.
  {% if home_all or 'Y' in params %}
    INITIALIZE_TOOLCHANGER
  {% endif %}

  {% if home_all or 'X' in params %}
    _HOME_X
  {% endif %}

  {% if home_all or 'Z' in params %}
    G90
    G0 X175 Y175 F18000
    G28 Z
    G0 Z10 F3000
  {% endif %}

  M400
