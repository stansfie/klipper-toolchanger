#####################################################################
#   Liftbar Macros
#####################################################################
#
# EXAMPLE — real-world liftbar macros from a Voron 2.4 / StealthChanger
# build (4 tools, dual liftbar rails, Cartographer probe on the shuttle).
#
# The liftbar is a separate Z lifter rail (see hardware.cfg) that carries
# the docks up and down. The toolhead only moves in X/Y for a tool change;
# the liftbar provides the Z motion to engage/disengage tools. This is the
# "Liftbar + Flying gantry" dock layout described in examples/README.md.
#
# Companion files:
#   hardware.cfg               - [manual_rail liftbar] + tmc + [idle_timeout]
#   homing.cfg                 - G32 / QGL / homing_override that drive the liftbar
#   toolhead_calibration.cfg   - per-tool offset calibration macros
#
# Tweak heights, speeds and panel limits for your own machine.
#####################################################################

[gcode_macro LIFTBAR_HOME]
variable_homed: 0
gcode:
  {% if not printer["gcode_macro LIFTBAR_HOME"].homed or params.FORCE|default(0)|int %}
    MANUAL_RAIL RAIL=liftbar HOME=1
    SET_GCODE_VARIABLE MACRO=LIFTBAR_HOME VARIABLE=homed VALUE=1
  {% else %}
    LIFTBAR_MOVE Z=25
  {% endif %}

[gcode_macro LIFTBAR_STOW]
variable_position: 0
gcode: LIFTBAR_MOVE Z={ printer.toolchanger.params_liftbar_stow_height | float }

[gcode_macro LIFTBAR_MOVE]
variable_position: 0
# Enclosure panel state — 1 = attached (liftbar capped at hot_max_z), 0 = removed (full travel).
# Defaults to 1 on boot for safety. Toggle via PANEL_ON / PANEL_OFF.
variable_panel_on: 1
variable_panel_max_z: 180

gcode:
 # Check if liftbar has been homed
 {% if printer["gcode_macro LIFTBAR_HOME"].homed == 0 %}
   { action_respond_info("Liftbar not homed, homing now...") }
   LIFTBAR_HOME
 {% endif %}

 {% if 'Z' not in params %}
   MANUAL_RAIL RAIL=liftbar SYNC={params.SYNC if 'SYNC' in params else 1}
 {% else %}
   {% set requested_z = params.Z|float %}
   {% set max_z = printer.configfile.settings["manual_rail liftbar"].position_max|float %}
   {% set panel_max_z = printer["gcode_macro LIFTBAR_MOVE"].panel_max_z|float %}
   {% set panel_on = printer["gcode_macro LIFTBAR_MOVE"].panel_on %}
   {% if panel_on %}
     {% set max_z = [max_z, panel_max_z]|min %}
   {% endif %}
   {% set safe_z = [requested_z, max_z]|min %}
   {% set speed = (params.F|float)/60.0 if 'F' in params else 200 %}
   {% if safe_z < requested_z %}
     RESPOND TYPE=echo MSG="Liftbar Z capped at {safe_z}mm (requested {requested_z}mm) — panel on"
   {% endif %}
   MANUAL_RAIL RAIL=liftbar MOVE={safe_z} SPEED={speed} SYNC={params.SYNC if 'SYNC' in params else 1}
   SET_GCODE_VARIABLE MACRO=LIFTBAR_MOVE VARIABLE=position VALUE={safe_z}
 {% endif %}

# Moves liftbar up away from current print layer, if necessary
[gcode_macro LIFTBAR_LAYER_CHANGE]
  gcode:
   {% set cur_z = printer.toolhead.position[2]|float %}
   {% set lbz = printer["gcode_macro LIFTBAR_MOVE"].position %}
   {% set clearance = printer.toolchanger.params_liftbar_safe_clearance %}
   {% set lb_target = [ cur_z + clearance, printer.configfile.settings["manual_rail liftbar"].position_max ] | min %}
   {% if lbz < lb_target %}
      LIFTBAR_MOVE Z={lb_target} SYNC=0 F={ printer.toolchanger.params_liftbar_speed }
   {% endif %}

[gcode_macro LIFTBAR_PARK_TOP]
gcode:
    LIFTBAR_MOVE Z={ printer.configfile.settings['manual_rail liftbar'].position_max| float }

#####################################################################
#   Panel macros
#####################################################################
# When the front enclosure panel is attached the liftbar would crash into
# it at full travel, so PANEL_ON caps every LIFTBAR_MOVE at panel_max_z.
# Remove the panel and call PANEL_OFF to restore full travel.

[gcode_macro PANEL_ON]
description: Mark enclosure panel as attached; liftbar Z will be capped at panel_max_z
gcode:
    SET_GCODE_VARIABLE MACRO=LIFTBAR_MOVE VARIABLE=panel_on VALUE=1
    RESPOND TYPE=echo MSG="Panel ON — liftbar capped at {printer['gcode_macro LIFTBAR_MOVE'].panel_max_z|int}mm"

[gcode_macro PANEL_OFF]
description: Mark enclosure panel as removed; full liftbar travel restored
gcode:
    SET_GCODE_VARIABLE MACRO=LIFTBAR_MOVE VARIABLE=panel_on VALUE=0
    RESPOND TYPE=echo MSG="Panel OFF — liftbar full travel restored"

#####################################################################
#   Motor / homed-state handling
#####################################################################
# MOTORS_OFF is called by [idle_timeout] (hardware.cfg) AFTER the liftbar
# has been homed/lowered, so the rail never free-falls when the steppers
# are disabled. It also clears the homed flag so the next move re-homes.

[gcode_macro MOTORS_OFF]
description: Disable all motors and reset liftbar homed state
gcode:
    M84                                              # Disable all motors
    SET_GCODE_VARIABLE MACRO=LIFTBAR_HOME VARIABLE=homed VALUE=0  # Reset homed flag when motors disabled

[gcode_macro TEST_LIFTBAR_SPEED]
description: Test liftbar speed and check for missed steps (like TEST_SPEED for XY)
gcode:
    {% set speed = params.SPEED|default(200)|float %}
    {% set accel = params.ACCEL|default(500)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound = params.BOUND|default(5)|float %}
    {% set pos_min = printer.configfile.settings["manual_rail liftbar"].position_min|float + bound %}
    {% set pos_max = printer.configfile.settings["manual_rail liftbar"].position_max|float - bound %}

    # Home liftbar and move to start
    LIFTBAR_HOME FORCE=1
    LIFTBAR_MOVE Z={pos_min} F={speed * 60}

    # Bounce between min and max at test speed
    {% for i in range(iterations) %}
        MANUAL_RAIL RAIL=liftbar MOVE={pos_max} SPEED={speed} ACCEL={accel}
        MANUAL_RAIL RAIL=liftbar MOVE={pos_min} SPEED={speed} ACCEL={accel}
    {% endfor %}

    # Move to just above endstop, then re-home
    MANUAL_RAIL RAIL=liftbar MOVE={pos_min} SPEED={speed} ACCEL={accel}
    LIFTBAR_HOME FORCE=1
