#####################################################################
#   Calibration Macros
#####################################################################
#
# EXAMPLE — per-tool XY/Z offset calibration for a liftbar build.
#
# Two independent flows are provided:
#   1. CALIBRATE_TOOL_OFFSETS  - full XY+Z offsets via a contact probe
#      (here: an Axiscope / tools_calibrate sensor). Writes gcode_x/y/z
#      offsets back to each tool's config.
#   2. CALIBRATE_TOOL_Z_*      - Z-only offsets via Cartographer touch,
#      relative to a T0 baseline. Useful after a single hotend swap.
#
# These reference macros defined elsewhere in this build:
#   CLEAN_NOZZLE, CARTOGRAPHER_TOUCH_HOME, CARTOGRAPHER_TOUCH_PROBE,
#   TOOL_LOCATE_SENSOR, TOOL_CALIBRATE_TOOL_OFFSET,
#   TOOL_CALIBRATE_SAVE_TOOL_OFFSET (from the toolchanger / axiscope).
# Adjust section names ("tool ebbT0" ...) and probe coords to your setup.
#####################################################################

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
gcode:
    {% set tool = printer[printer.toolchanger.tool] %}
    BED_MESH_CLEAR
    G0 Z{tool.params_probe_z} F10000
    G0 X{tool.params_probe_x} Y{tool.params_probe_y} F10000

[gcode_macro CALIBRATE_TOOL_OFFSETS]
gcode:
    T0
    M109 S150  # Heat up as much as possible without oozing to account for any thermal deformations
    CLEAN_NOZZLE
    CARTOGRAPHER_TOUCH_HOME
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    M104 S0
    # Calibrate all other tools dynamically
    {% for tool_num in printer.toolchanger.tool_numbers %}
        {% if tool_num != 0 %}  # Skip T0, already done
            T{tool_num}
            M109 S150
            CLEAN_NOZZLE
            CALIBRATE_MOVE_OVER_PROBE
            TOOL_CALIBRATE_TOOL_OFFSET
            TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="tool ebbT{tool_num}" ATTRIBUTE="gcode_x_offset" VALUE="{% raw %}{x:0.6f}{% endraw %}"
            TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="tool ebbT{tool_num}" ATTRIBUTE="gcode_y_offset" VALUE="{% raw %}{y:0.6f}{% endraw %}"
            TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="tool ebbT{tool_num}" ATTRIBUTE="gcode_z_offset" VALUE="{% raw %}{z:0.6f}{% endraw %}"
            M104 S0
        {% endif %}
    {% endfor %}
    T0
    SAVE_CONFIG

#####################################################################
#   Z-only tool offset calibration via Cartographer touch
#####################################################################
# Probes the bed at (X, Y) -- default (175, 175) -- with each toolhead
# using CARTOGRAPHER_TOUCH_PROBE, then computes gcode_z_offset for
# T1..Tn relative to T0.
#
# Three entry points:
#   CALIBRATE_TOOL_Z_BASELINE                  # T0 must be active + hot; sets baseline
#   CALIBRATE_TOOL_Z_OFFSET TOOL=n             # Tn must be active + hot; applies delta vs baseline
#   CALIBRATE_TOOL_Z_OFFSETS                   # full sweep T0..Tn (heats / cools per tool)
#
# Single-tool usage (e.g. recalibrating just T2 after a hotend swap):
#   T0 ; M109 S150
#   CALIBRATE_TOOL_Z_BASELINE
#   T2 ; M109 S150
#   CALIBRATE_TOOL_Z_OFFSET TOOL=2 APPLY=1
#   M104 S0
#   SAVE_CONFIG
#
# APPLY defaults to 0 (dry-run). APPLY=1 modifies your hardware/ebb-36-T*.cfg
# files in place; follow with SAVE_CONFIG to restart and commit.
#
# NOTE on implementation: Klipper renders the whole macro template up-front,
# so `printer.cartographer.touch.last_z_result` cannot be read inline -- it
# would always evaluate to the value present BEFORE any probe ran. The probe
# read is therefore delegated to child macros (_CTZ_RECORD_BASELINE / _CTZ_APPLY)
# which are re-rendered at execution time, after the matching probe finishes.
# The baseline is stored in the CALIBRATE_TOOL_Z_OFFSETS gcode variable
# (persists for the life of Klipper) so single-tool probes can reference it.

[gcode_macro CALIBRATE_TOOL_Z_BASELINE]
description: Probe T0 (must already be active + hot) and record Z baseline for later per-tool deltas
gcode:
    {% set probe_x = params.X|default(175)|float %}
    {% set probe_y = params.Y|default(175)|float %}
    {% set active  = printer.toolchanger.tool %}
    {% if active != "tool ebbT0" %}
        { action_raise_error("CALIBRATE_TOOL_Z_BASELINE requires T0 active, current=" ~ active) }
    {% endif %}
    CLEAN_NOZZLE
    CARTOGRAPHER_TOUCH_HOME
    G90
    G0 X{probe_x} Y{probe_y} F18000
    CARTOGRAPHER_TOUCH_PROBE
    _CTZ_RECORD_BASELINE

[gcode_macro CALIBRATE_TOOL_Z_OFFSET]
description: Probe the currently-active tool and compute gcode_z_offset delta vs T0 baseline. Args: TOOL=n APPLY=0|1
gcode:
    {% set tool_num = params.TOOL|int %}
    {% set probe_x  = params.X|default(175)|float %}
    {% set probe_y  = params.Y|default(175)|float %}
    {% set apply    = params.APPLY|default(0)|int %}
    {% set active   = printer.toolchanger.tool %}
    {% set expected = "tool ebbT" ~ tool_num %}
    {% if active != expected %}
        { action_raise_error("CALIBRATE_TOOL_Z_OFFSET TOOL=" ~ tool_num ~ " requires " ~ expected ~ " active, current=" ~ active) }
    {% endif %}
    {% if printer["gcode_macro CALIBRATE_TOOL_Z_OFFSETS"].baseline_set|int == 0 %}
        { action_raise_error("No baseline recorded; run CALIBRATE_TOOL_Z_BASELINE first") }
    {% endif %}
    CLEAN_NOZZLE
    G90
    G0 X{probe_x} Y{probe_y} F18000
    CARTOGRAPHER_TOUCH_PROBE
    _CTZ_APPLY TOOL={tool_num} APPLY={apply}

[gcode_macro CALIBRATE_TOOL_Z_OFFSETS]
description: Full sweep — probe T0 baseline then every other tool, updating gcode_z_offset
variable_t0_z: 0.0
variable_baseline_set: 0
gcode:
    {% set probe_x = params.X|default(175)|float %}
    {% set probe_y = params.Y|default(175)|float %}
    {% set apply       = params.APPLY|default(0)|int %}            # default 0 = dry-run; APPLY=1 writes to ebb-36-T*.cfg
    {% set heat        = params.HEAT|default(1)|int %}             # set HEAT=0 when temps already managed
    {% set drift_check = params.DRIFT_CHECK|default(0)|int %}      # set DRIFT_CHECK=1 to re-probe T0 at end for diagnostics

    # --- Baseline: T0 ---
    T0
    {% if heat %}M109 S150{% endif %}
    CALIBRATE_TOOL_Z_BASELINE X={probe_x} Y={probe_y}
    {% if heat %}M104 S0{% endif %}

    # --- Each subsequent tool ---
    {% for tool_num in printer.toolchanger.tool_numbers %}
        {% if tool_num != 0 %}
            T{tool_num}
            {% if heat %}M109 S150{% endif %}
            CALIBRATE_TOOL_Z_OFFSET TOOL={tool_num} APPLY={apply} X={probe_x} Y={probe_y}
            {% if heat %}M104 S0{% endif %}
        {% endif %}
    {% endfor %}

    # --- Drift check: re-probe T0 (optional) ---
    {% if drift_check %}
        T0
        {% if heat %}M109 S150{% endif %}
        CLEAN_NOZZLE
        G0 X{probe_x} Y{probe_y} F18000
        CARTOGRAPHER_TOUCH_PROBE
        _CTZ_DRIFT_CHECK
        {% if heat %}M104 S0{% endif %}
    {% endif %}
    {% if apply %}
        RESPOND PREFIX="TOOLZ" MSG="Run SAVE_CONFIG to persist new gcode_z_offset values"
    {% else %}
        RESPOND PREFIX="TOOLZ" MSG="Dry-run complete. Re-run with APPLY=1 to write to ebb-36-T*.cfg"
    {% endif %}

[gcode_macro _CTZ_RECORD_BASELINE]
description: Internal helper — reads cartographer touch result and stores as baseline
gcode:
    {% set z = printer.cartographer.touch.last_z_result|float %}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_OFFSETS VARIABLE=t0_z VALUE={z}
    SET_GCODE_VARIABLE MACRO=CALIBRATE_TOOL_Z_OFFSETS VARIABLE=baseline_set VALUE=1
    RESPOND PREFIX="TOOLZ" MSG="T0 baseline z={ '%.6f' % z }"

[gcode_macro _CTZ_APPLY]
description: Internal helper — reads cartographer touch result, computes delta, optionally writes config
gcode:
    {% set tool_num = params.TOOL|int %}
    {% set apply    = params.APPLY|default(0)|int %}
    {% set tn_z    = printer.cartographer.touch.last_z_result|float %}
    {% set t0_z    = printer["gcode_macro CALIBRATE_TOOL_Z_OFFSETS"].t0_z|float %}
    {% set section = "tool ebbT" ~ tool_num %}
    {% set old     = printer.configfile.settings[section|lower].gcode_z_offset|float %}
    {% set new     = old + (tn_z - t0_z) %}
    RESPOND PREFIX="TOOLZ" MSG="T{tool_num} z={ '%.6f' % tn_z } old={ '%.6f' % old } -> new={ '%.6f' % new } (delta { '%+0.6f' % (new - old) })"
    RESPOND PREFIX="TOOLZ" MSG="T{tool_num} gcode_z_offset: { '%.6f' % new }"
    {% if apply %}
        TOOL_CALIBRATE_SAVE_TOOL_OFFSET SECTION="{section}" ATTRIBUTE="gcode_z_offset" VALUE="{ '%.6f' % new }"
    {% endif %}

[gcode_macro _CTZ_DRIFT_CHECK]
description: Internal helper — compares current T0 probe to stored baseline
gcode:
    {% set z      = printer.cartographer.touch.last_z_result|float %}
    {% set t0_z   = printer["gcode_macro CALIBRATE_TOOL_Z_OFFSETS"].t0_z|float %}
    RESPOND PREFIX="TOOLZ" MSG="T0 drift check z={ '%.6f' % z } (delta { '%+0.6f' % (z - t0_z) })"
