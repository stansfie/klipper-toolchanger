#--------------------------------------------------------------------
# HOMING (liftbar-aware)
#--------------------------------------------------------------------
#
# EXAMPLE — homing / gantry-level macros for a flying-gantry liftbar build.
#
# Key liftbar interactions:
#   * QUAD_GANTRY_LEVEL / G32 raise the liftbar to params_liftbar_max_z
#     before QGL so the docks are clear of the gantry sweep.
#   * _ADJUST_Z_POSITION_WITH_TOOL_OFFSET folds the active tool's
#     gcode_z_offset into the kinematic position after homing.
#
# The two other "homing details" you asked about live in companion files:
#   * Panel macro (PANEL_ON / PANEL_OFF) ............ liftbar.cfg
#   * Home the liftbar before power off ([idle_timeout]) ... hardware.cfg
#
# The [homing_override] that re-orders XYZ homing around the liftbar /
# toolchanger lives in your main toolchanger config — see README.md.
#--------------------------------------------------------------------

[gcode_macro _HOME_X]
gcode:
    {% set HOME_CUR = 0.800 %}
    {% set driver_config = printer.configfile.settings['tmc2209 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    # Set current for sensorless homing
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    # Pause to ensure driver stall flag is clear
    G4 P2000
    # Home
    G28 X0
    # Move away
    G91
    G1 X-10 F1200
     # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}

[gcode_macro _ADJUST_Z_POSITION_WITH_TOOL_OFFSET]
gcode:
  {% set tool_name = printer.toolchanger.tool %}
  {% if tool_name %}
    {% set offset = printer[tool_name].gcode_z_offset %}
    SET_KINEMATIC_POSITION Z={printer.toolhead.position.z + offset}
  {% endif %}

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
description: Level the gantry
gcode:
    LIFTBAR_MOVE z={ printer.toolchanger.params_liftbar_max_z }
    _QUAD_GANTRY_LEVEL                                # Run the actual QGL
    G90
    G0 Y{ printer.toolchanger.params_safe_y } F{ printer.toolchanger.params_fast_speed }  # Move Y clear of docks


[gcode_macro G32]
gcode:

    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    LIFTBAR_MOVE z={ printer.toolchanger.params_liftbar_max_z }
    STATUS_HOMING
    G28
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    STATUS_HOMING
    G28
    #PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro CG32]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G32
    {% endif %}

[gcode_macro CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}
