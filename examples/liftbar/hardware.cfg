#####################################################################
#   Liftbar hardware + power-off homing
#####################################################################
#
# EXAMPLE — the hardware definitions the liftbar macros depend on, plus
# the [idle_timeout] that homes the liftbar BEFORE the steppers are
# disabled. Pins are for a BTT Octopus Pro v1.0 (MOTOR_6 / MOTOR_7);
# change them to match your board and wiring.
#
# This build uses TWO rails (left + right) lifting a single bar. Only
# the primary rail ("liftbar") is homed/commanded by the macros; the
# second rail ("liftbar1") is driven in lockstep — see your manual_rail
# multi-motor setup. Drop liftbar1 if you have a single-motor lifter.
#####################################################################

#####################################################################
#   [toolchanger] liftbar parameters
#####################################################################
# Paste these params into your existing [toolchanger] section. The
# liftbar macros and homing.cfg read them via printer.toolchanger.*
#
# [toolchanger]
#   params_liftbar_stow_height: 431.0   # height to lift above change height
#   params_liftbar_safe_clearance: 200.0 # clearance above print during toolchanges
#   params_liftbar_speed: 12000         # mm/min used for LIFTBAR_MOVE F=
#   params_liftbar_min_z: 25.00
#   params_liftbar_max_z: 431           # full travel; lower this when a panel is on
#
#   initialize_gcode:
#     LIFTBAR_HOME
#     LIFTBAR_MOVE z={ toolchanger.params_liftbar_stow_height } F={ toolchanger.params_liftbar_speed }

#####################################################################
#   Liftbar rails
#####################################################################

# left side — Connected to MOTOR_6
[manual_rail liftbar]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 20
step_pulse_duration: 0

accel: 2000
velocity: 500
endstop_pin: PG10
position_min: 25
position_endstop: 25
position_max: 431
homing_speed: 50

[tmc2209 manual_rail liftbar]
uart_pin: PE1
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# right side — Connected to MOTOR_7
[manual_rail liftbar1]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 20
step_pulse_duration: 0
endstop_pin: PG11

[tmc2209 manual_rail liftbar1]
uart_pin: PD3
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Home the liftbar before power / motors turn off
#####################################################################
# A manual_rail liftbar has no brake — if the steppers are disabled while
# the bar is raised it free-falls. On idle timeout we therefore LOWER the
# liftbar back to its endstop (LIFTBAR_HOME -> Z=25) FIRST, then disable
# motors via MOTORS_OFF (which also clears the homed flag). Both macros
# live in liftbar.cfg.

[idle_timeout]
timeout: 1800
gcode:
    LIFTBAR_HOME  # Lower liftbar to Z=25 before disabling motors
    MOTORS_OFF    # see liftbar.cfg
